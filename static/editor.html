<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor - FlashWiki</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>FlashWiki — Редактор статей</h1>
    </header>
    <main>
        <div class="editor-header">
            <h1>FlashWiki — Редактор статей</h1>
            <p class="editor-subtitle">Отправляйте материалы на проверку, прикрепляйте обложки и теги.</p>
        </div>
        <div id="notify" class="notify"></div>
        <div id="editor-status" class="editor-status">Проверка авторизации...</div>
        <form id="articleForm">
            <input type="text" id="title" placeholder="Заголовок" required />
            <textarea id="content" placeholder="Содержимое (Markdown)" required></textarea>
            <input type="text" id="tags" placeholder="Теги через запятую" />
            <label for="coverFile">Обложка (опционально)</label>
            <input type="file" id="coverFile" accept="image/*" />
            <button type="submit">Отправить на проверку</button>
        </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/static/api.js"></script>
    <script>
        const articleForm = document.getElementById('articleForm');
        const editorStatus = document.getElementById('editor-status');

        async function checkEditorAccess() {
            const profile = await api.getProfile();
            if (profile.success) {
                editorStatus.textContent = `Автор: ${profile.user.name || profile.user.email}`;
                articleForm.style.display = 'block';
            } else {
                editorStatus.textContent = 'Требуется вход в систему. Пожалуйста, войдите через главную страницу.';
                articleForm.style.display = 'none';
            }
        }

        articleForm.addEventListener('submit', async (e)=>{
            e.preventDefault();
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;
            const tags = document.getElementById('tags').value.split(',').map(s=>s.trim()).filter(Boolean);
            const fileInput = document.getElementById('coverFile');
            api.notify('Отправка...', 'info');
            let cover_url = null;
            try{
                if(fileInput && fileInput.files && fileInput.files[0]){
                    const up = await api.uploadImage(fileInput.files[0]);
                    if(up && up.success){ cover_url = up.url; }
                    else { api.notify((up && up.message) || 'Ошибка загрузки', 'error'); return; }
                }

                const res = await api.createArticle({title, content, tags, cover_image: cover_url});
                if(res && res.success){ api.notify('Статья отправлена', 'success'); articleForm.reset(); }
                else api.notify((res && res.message) || 'Ошибка создания', 'error');
            }catch(err){ api.notify(err.message || 'Ошибка', 'error'); }
        });

        checkEditorAccess();
    </script>
</body>
</html>
