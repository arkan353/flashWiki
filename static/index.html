<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/static/style.css">

</head>
<body>
    <button class="login_btn" onclick="showLoginModal()">
        Login
    </button>

    <div id="login-modal" class="login-modal">
        <div class="modal_content">
            <h2>Вход</h2>
            <form id="login-form">
                <input id="login-email" type="email" placeholder="Email" required />
                <input id="login-password" type="password" placeholder="Пароль" required />
                <button type="submit">Войти</button>
                <button type="button" onclick="closeLoginModal()" style="margin-top:0.5rem;background:#888;">Отмена</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/static/api.js"></script>
    <script src="/static/modals.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', loginModalOnSubmit);
    </script>
</body>
</html>
